<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 055</title>
  <desc>Turn a memorable subject, gesture, and spatial relation into a gentle pastel-painted editorial narrative with airy blue light.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F7F1E8"/>
    <ellipse cx="1020" cy="55" rx="270" ry="180" fill="#A9CCE0" fill-opacity=".42"/>
    <ellipse cx="1010" cy="375" rx="250" ry="150" fill="#EAC7C4" fill-opacity=".40"/>
    <path d="M845 48C920 35 1010 55 1082 112C1125 147 1149 198 1128 234C1099 284 1001 283 928 249C858 216 807 155 818 103C824 77 833 57 845 48Z" fill="#83B7D1" fill-opacity=".42" filter="url(#soft)"/>

    <g transform="translate(58 42)">
      <rect width="224" height="34" rx="8" fill="#203A45"/>
      <text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
      <text y="112" fill="#203A45" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#D8867F">055</tspan></text>
      <text x="2" y="151" fill="#3F86A5" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".22">SUBJECT NARRATIVE · HEALING PASTELS · LIGHT OIL TEXTURE · AIRY BLUE</text>
      <text x="2" y="198" fill="#203A45" font-family="sans-serif" font-size="18" font-weight="800">把一束光、一个动作与一个空间关系画成温柔的视觉叙事</text>
      <text x="2" y="230" fill="#496775" font-family="sans-serif" font-size="14" font-weight="700">光、動作、空間の関係を、やさしい視覚物語へ</text>
      <text x="2" y="260" fill="#496775" font-family="sans-serif" font-size="14" font-weight="700">빛과 동작, 공간의 관계를 부드러운 시각 서사로</text>
      <text x="2" y="291" fill="#496775" font-family="Arial,sans-serif" font-size="13" font-weight="700">تحويل الضوء والحركة والعلاقة المكانية إلى حكاية بصرية رقيقة</text>
    </g>

    <g transform="translate(58 334)">
      <rect width="105" height="34" rx="8" fill="#203A45"/><text x="52.5" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">SOURCE-BOUND</text>
      <rect x="117" width="88" height="34" rx="8" fill="#D8867F"/><text x="161" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">4 MODES</text>
      <rect x="217" width="132" height="34" rx="8" fill="#5E9EBC"/><text x="283" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">WALLPAPER PACK</text>
    </g>

